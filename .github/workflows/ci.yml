name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: therace_test
          POSTGRES_USER: therace
          POSTGRES_PASSWORD: therace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therace -d therace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DISCORD_TOKEN: test-discord-token
      RIOT_API_KEY: test-riot-api-key
      DISCORD_CHANNEL: "123456789"
      REQUESTS: "100"
      DAILY: "21"
      DATABASE_URL: postgresql+psycopg://therace:therace@localhost:5432/therace_test
      AUTO_MIGRATE_JSON: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q src scripts

      - name: Validate locale JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("src/locales").glob("*.json"):
              with path.open("r", encoding="utf-8") as file:
                  json.load(file)
          PY

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing
